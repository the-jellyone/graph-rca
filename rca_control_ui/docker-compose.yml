version: '3.8'

services:
  rca-control-ui:
    build:
      context: ..
      dockerfile: rca_control_ui/Dockerfile
    container_name: graph-rca-control-ui
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - SOCKSHOP_URL=http://front-end
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - GRAPH_RCA_CONTROLLER_PYTHON=/usr/local/bin/python
      - GRAPH_RCA_POLICY_BUNDLE=/workspace/runs/live_v3_export
      - GRAPH_RCA_LIVE_REGISTRY=/workspace/runs/live_v3/deployment.json
      - GRAPH_RCA_LIVE_OUTPUT=/workspace/runs/live_v3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/workspace/rca_control_ui/data
      - ../runs:/workspace/runs
    restart: unless-stopped
    networks:
      - sockshop

networks:
  sockshop:
    external: true
    # Local legacy compose defaults to rca-project_sockshop. The verified GCP
    # lab uses rca-lab_sockshop; select it with SOCKSHOP_NETWORK on the VM.
    name: ${SOCKSHOP_NETWORK:-rca-project_sockshop}
